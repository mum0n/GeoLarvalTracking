# ==============================================================================
#  GeoLarvalTracking/configs/snowcrab.toml — the biology half, Snow Crab production
# ==============================================================================
#
#  The production counterpart to ../GeoOceanModel/configs/scotian_shelf.toml: it tracks
#  the Snow Crab (Chionoecetes opilio) cohort through the Scotian Shelf store that ocean
#  config produces. The domain, grid, and forcing are that run's, so they are not repeated
#  here — this half carries only the biology it adds, and the coupling is the store path:
#
#      julia --project=. GeoLarvalTrackingRun.jl --rerun \
#        --hydro-file=../GeoOceanModel/outputs/scotian_shelf/hydrodynamics.zarr
#
#  `default.toml` is its quick keyless demonstration twin (Cape Breton, small cohort,
#  generic placeholder biology). This one is the real thing: a 500-particle cohort tracked
#  for the full 60-day pelagic larval duration against the higher-resolution snowcrab
#  domain, with the snow-crab biology/dvm/molting parameters from the original
#  ParticleTracking/configs/snowcrab.toml, and a 5000-unit depth-stratified tessellation
#  for connectivity.
#
#  The biology/dvm/molting numbers are published snow-crab values (Sainte-Marie &
#  Sainte-Marie 1999; Lovrich & Sainte-Marie 1997; Kuhn & Choi 2011). The stochasticity
#  controls (cv_*) are still placeholders, not fitted: the file records all options, so a
#  calibration is a change to this file and nowhere else.
#
#  Sections: biology, dvm, molting_and_settlement, tessellation — same shape as
#  default.toml, at production scale.
# ==============================================================================

[biology]
# Snow crab larval cohort. track_duration_days = 60 matches the pelagic larval duration
# used to drive the run. max_flow_snapshots bounds how many ocean-store intervals are held
# resident for the track.
n_particles = 500
track_duration_days = 60.0
track_dt_seconds = 300.0
min_seabed_depth = 50.0
diffusivity_h = 10.0
diffusivity_v = 1.0e-4
release_depth_mode = "bottom"
bottom_release_offset = [0.5, 3.0]
enable_initial_ascent = true
ascent_speed = 0.010
ascent_target_depth = -10.0
buffer_km = 50.0
seed = 42
max_flow_snapshots = 400
# An unreadable store must not stand in silently for the real flow; allow_analytical_fallback
# lets a deliberate demo fall back to a synthetic jet, and is off here.
allow_analytical_fallback = false

cv_molt = 0.25                # per-particle degree-day molt-threshold spread (placeholder)
cv_mortality = 0.25           # per-particle mortality-rate spread (placeholder)
cv_settlement = 0.25          # spread on the habitat-suitability index (placeholder)
settlement_stochastic = true  # draw settlement probabilistically rather than on HSI alone


[dvm]
# Stage-dependent DVM (Sainte-Marie et al.; Kuhn & Choi 2011): larvae ascend at night to
# feed and descend by day for predator avoidance.
enable_dvm = true
zoea1_day_depth = -50.0
zoea1_night_depth = -10.0
zoea2_day_depth = -55.0
zoea2_night_depth = -8.0
megalopa_day_depth = -120.0
megalopa_night_depth = -60.0
zoea2_depth_factor = 1.0
megalopa_swim_factor = 1.0


[molting_and_settlement]
# Degree-day phenology (T_base = -1.5 C) and settlement criteria for the snow crab nursery.
enable_molting = true
t_base = -1.5
dd_zoea1_to_zoea2 = 65.0
dd_zoea2_to_megalopa = 130.0
dd_megalopa_to_settle = 200.0
settlement_min_depth = -350.0
settlement_max_depth = -50.0
settlement_max_temp = 6.0
mortality_base = 0.01
mortality_thermal_threshold = 15.0
mortality_thermal_sensitivity = 0.02
mortality_cold_threshold = 0.0
mortality_cold_sensitivity = 0.01


[tessellation]
# Depth-stratified Voronoi release/connectivity strata for the snow crab domain, denser than
# the demo (5000 units).
enable_voronoi = true
n_units = 5000
core_depth_min = 50.0
core_depth_max = 350.0
prob_core = 0.8
min_res_core_km = 1.5
shallow_depth_min = 0.0
shallow_depth_max = 50.0
prob_shallow = 0.1
min_res_shallow_km = 5.0
deep_depth_min = 350.0
deep_depth_max = 6000.0
prob_deep = 0.1
min_res_deep_km = 10.0
slope_weighting = true
slope_factor = 15.0


[directories]
# The two directories that wire the halves together, both in the shared lakehouse.
# `ocean_model` is the realized ocean simulation to track through -- here the Scotian
# Shelf production store this half is the counterpart to. `output_path` is this half's
# results directory (trajectories, metrics, figures), replacing the local `outputs/`.
ocean_model = "../lakehouse/GeoOceanModel/scotian_shelf"
output_path = "../lakehouse/GeoLarvalTracking/snowcrab"
