# =============================================================================
# GeoLarvalTracking - Snow Crab (Chionoecetes opilio) Production Configuration
# =============================================================================
# High-resolution Lagrangian larval transport configuration for Snow Crab across
# the Scotian Shelf. Tracks the larval cohort through the realized 3D circulation
# flow fields generated by GeoOceanModel (configs/scotian_shelf.toml).
#
#   julia --project=. GeoLarvalTrackingRun.jl --config=configs/snowcrab.toml
#
# This file is the record of the model that ran: every parameter the package reads
# is written here with the value the run used. A key that is not in this file is not
# a setting, and a value here is the truth the code reads.
#
# The ocean half is configured separately, in GeoOceanModel's own files. The two
# are coupled by PATH: `[storage] ocean_model` names the realized ocean store this
# run tracks through, and the run reads that store's own coordinates.
# =============================================================================

[storage]
# Where this run reads from and writes to. Both live here, in one section, with one
# name each: two sections naming the same run's places is two chances for them to
# disagree, and the disagreement is silent.
#
# Relative paths are resolved against this package's root, so `../lakehouse/...` is
# the sibling lakehouse and `lakehouse/...` the in-project one; either form works.
output_dir = "../lakehouse/GeoLarvalTracking/snowcrab" # Target Lakehouse output directory
# The realized ocean store this run tracks through: the `hydrodynamics.zarr`
# directory the ocean half wrote, not the run directory that contains it. A
# command-line `--hydro-file` overrides this.
ocean_model = "../lakehouse/GeoOceanModel/scotian_shelf/hydrodynamics.zarr"
# The backend the larval data is written in.
storage_backend = "zarr"
# Whether the trajectory store is written at all.
enable_zarr = true            # Persist Lagrangian larval trajectories to Zarr
# Field-output cadence, in seconds. Distinct from the checkpoint cadence below:
# the two may legitimately differ.
output_schedule_seconds = 21600.0 # Field-output interval (seconds, 6 hours)
# Whether restart archives are written.
enable_checkpoint = true      # Save simulation checkpointer state
# Filename prefix of the restart archives.
checkpoint_prefix = "checkpoint_ParticleTracking" # Checkpoint filename prefix
# State-checkpoint cadence, in seconds.
checkpoint_schedule_seconds = 0.0 # State checkpoint frequency in seconds (0 = match output)
# Whether older restart archives are purged when a new one is written.
checkpoint_cleanup = true     # Automatically purge older intermediate checkpoints
# A tag appended to the run's output names. Empty means "no tag".
run_id = ""                   # Unique run identifier tag
# The trajectory store and the restart archives are NOT named here. They are
# derived from `output_dir` -- <output_dir>/particle_tracking.zarr and
# <output_dir>/checkpoints -- so that a run's outputs are all in one place and
# cannot be split across two directories. The resolved paths are recorded in the
# run's `resolved_config.toml`.

[biology]
# Snow crab larval cohort advection and behavior
n_particles = 500             # Larval particle cohort size
track_duration_days = 365.0   # Full dispersal duration (days)
track_dt_seconds = 300.0      # Advection time step in seconds (5 minutes)
min_seabed_depth = 50.0       # Minimum release water depth (m)
diffusivity_h = 10.0          # Horizontal eddy diffusivity (m^2/s)
diffusivity_v = 1.0e-4        # Vertical eddy diffusivity (m^2/s)
release_depth_mode = "bottom" # Release stratum: "bottom"
bottom_release_offset = [0.5, 3.0] # Release elevation range above seabed (m)
enable_initial_ascent = true  # Active upward swimming post-hatch
ascent_speed = 0.010          # Swimming speed during initial ascent (m/s)
ascent_target_depth = -10.0   # Target epipelagic depth for ascent completion (m)
# Release buffer margin beyond Crab Fishing Areas (km). A `[domain] buffer_km`
# would take precedence over this; the domain itself belongs to the ocean run.
buffer_km = 50.0              # Release buffer margin beyond Crab Fishing Areas (km)

# Stochastic biology parameters
cv_molt = 0.25                # Degree-day molting threshold coefficient of variation
cv_mortality = 0.25           # Larval mortality coefficient of variation
cv_settlement = 0.25          # Settlement habitat suitability coefficient of variation
settlement_stochastic = true  # Probabilistic settlement selection

[dvm]
# Stage-dependent Diel Vertical Migration (Sainte-Marie et al. 1999, Kuhn & Choi 2011)
# Larvae ascend at night to feed and descend during daylight for predator avoidance.
enable_dvm = true             # Enable diurnal vertical migration
zoea1_day_depth = -50.0       # Daytime target depth for Zoea I (m)
zoea1_night_depth = -10.0     # Nighttime target depth for Zoea I (m)
zoea2_day_depth = -55.0       # Daytime target depth for Zoea II (m)
zoea2_night_depth = -8.0      # Nighttime target depth for Zoea II (m)
megalopa_day_depth = -120.0   # Daytime target depth for Megalopa (m)
megalopa_night_depth = -60.0  # Nighttime target depth for Megalopa (m)
zoea2_depth_factor = 1.0      # Depth scaling multiplier for Zoea II
megalopa_swim_factor = 1.0    # Swimming speed multiplier for Megalopa

[molting_and_settlement]
# Degree-day phenology and benthic nursery settlement criteria
enable_molting = true         # Track degree-day accumulation and ecdysis
t_base = -1.5                 # Physiological base temperature for degree-days (°C)
dd_zoea1_to_zoea2 = 65.0      # Cumulative degree-days to molt from Zoea I to Zoea II
dd_zoea2_to_megalopa = 130.0  # Cumulative degree-days to molt from Zoea II to Megalopa
dd_megalopa_to_settle = 200.0 # Cumulative degree-days for Megalopa to reach competence
settlement_min_depth = -500.0 # Deep bathymetric boundary for benthic settlement (m)
settlement_max_depth = -10.0  # Shallow bathymetric boundary for benthic settlement (m)
settlement_max_temp = 7.0     # Thermal ceiling for viable benthic settlement (°C)
mortality_base = 0.01         # Baseline daily mortality hazard rate (day^-1) .. ie, 0.365 /yr
mortality_thermal_threshold = 15.0 # Thermal stress threshold temperature (°C)
mortality_thermal_sensitivity = 0.02 # Incremental mortality per °C above threshold
mortality_cold_threshold = 0.0 # Cold stress threshold temperature (°C)
mortality_cold_sensitivity = 0.01 # Incremental mortality per °C below cold threshold

[visualization]
# Diagnostics, animations, and interactive mapping
interactive_map = true        # Export interactive HTML5 Leaflet map
animate_hydro = false         # Generate hydrodynamic animation
anim_variable = "dashboard"   # Variable: "dashboard", "speed", "temperature", "eta"
anim_fps = 10                 # Animation frames per second
anim_format = "mp4"           # Video container format: "mp4", "gif", or "webm"
anim_depth = -2.5             # Depth slice for 2D flow animation (m)
anim_overlay_particles = false# Render particle positions on top of flow field
anim_output_path = ""         # Custom destination path for animation video

[runtype]
# What kind of run this is, and what makes it reproducible. The same section the ocean
# half uses, so the two halves of a run describe themselves the same way.
seed = 42                     # Master RNG seed
