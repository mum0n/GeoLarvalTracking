# =============================================================================
# GeoLarvalTracking - Default Demonstration Configuration
# =============================================================================
# The larval half of a run: Lagrangian drift, diel vertical migration, degree-day
# molting, thermal mortality, and settlement on the nursery grounds.
#
#   julia --project=. GeoLarvalTrackingRun.jl --config=configs/default.toml
#
# This file is the record of the model that ran. Every parameter the package reads
# is written here with the value the run used, so a run can be reproduced from its
# configuration and nothing else. Two rules follow from that:
#
#   * A key that is not in this file is not a setting. It is a comment in TOML
#     syntax, and it lies to whoever edits the file next.
#   * A value here is the truth. The code reads it; the code does not hold a
#     competing copy of it.
#
# The ocean half is configured separately, in GeoOceanModel's own configuration
# files. The two are coupled by PATH, not by a shared file: `[storage] ocean_model`
# names the realized ocean store this run tracks through, and the run reads that
# store's own coordinates. The ocean's domain, grid and forcing are therefore not
# repeated here -- they belong to the ocean run, and repeating them would be one
# more place for the two halves to disagree.
# =============================================================================

[storage]
# Where this run reads from and writes to. Both live here, in one section, with one
# name each: two sections naming the same run's places is two chances for them to
# disagree, and the disagreement is silent.
#
# Relative paths are resolved against this package's root, so `../lakehouse/...` is
# the sibling lakehouse and `lakehouse/...` the in-project one; either form works.
output_dir = "../lakehouse/GeoLarvalTracking/default"
# The realized ocean store this run tracks through: the `hydrodynamics.zarr`
# directory the ocean half wrote, not the run directory that contains it. A
# command-line `--hydro-file` overrides this.
ocean_model = "../lakehouse/GeoOceanModel/default/hydrodynamics.zarr"
# The backend the larval data is written in.
storage_backend = "zarr"
# Whether the trajectory store is written at all.
enable_zarr = true
# Field-output cadence, in seconds. Distinct from the checkpoint cadence below:
# the two may legitimately differ.
output_schedule_seconds = 21600.0
# Whether restart archives are written.
enable_checkpoint = true
# Filename prefix of the restart archives.
checkpoint_prefix = "checkpoint_ParticleTracking"
# State-checkpoint cadence, in seconds.
checkpoint_schedule_seconds = 21600.0
# Whether older restart archives are purged when a new one is written.
checkpoint_cleanup = true
# A tag appended to the run's output names. Empty means "no tag".
run_id = ""
# The trajectory store and the restart archives are NOT named here. They are
# derived from `output_dir` -- <output_dir>/particle_tracking.zarr and
# <output_dir>/checkpoints -- so that a run's outputs are all in one place and
# cannot be split across two directories. The resolved paths are recorded in the
# run's `resolved_config.toml`.

[domain]
# The box the larvae are released into, and the region the run's outputs describe.
# These are the ocean run's own domain: the coupling is by path, and a larval
# release box that is not the box the ocean covered would put larvae in water the
# model never simulated. They match GeoOceanModel's `default.toml`.
lon_min = -61.2               # Western boundary longitude (°E)
lon_max = -59.6               # Eastern boundary longitude (°E)
lat_min = 45.0                # Southern boundary latitude (°N)
lat_max = 46.9                # Northern boundary latitude (°N)
z_min = -1500.0               # Deepest water of the coupled domain (m, negative down)
z_max = 0.0                   # Free surface (m)
# Margin around the domain kept free of releases, in kilometres.
buffer_km = 20.0

[biology]
# The cohort, its release, and its diffusion.
n_particles = 100             # Number of larvae released
track_duration_days = 5.0     # How long the cohort is tracked, in days
track_dt_seconds = 300.0      # Lagrangian integration time step (s)
min_seabed_depth = 100.0      # Minimum water depth for a release site (m)
diffusivity_h = 10.0          # Horizontal eddy diffusivity (m^2/s)
diffusivity_v = 0.0001        # Vertical eddy diffusivity (m^2/s)
# Where in the water column a larva is released: "bottom", "range" or "surface".
release_depth_mode = "bottom"
# Height above the seabed for a benthic release, as (low, high) in metres.
bottom_release_offset = [0.5, 3.0]
# Whether newly released larvae swim up to the surface mixed layer first.
enable_initial_ascent = true
# Ascent swimming speed (m/s) and the depth it aims for (m).
ascent_speed = 0.010
ascent_target_depth = -10.0
# Whether settlement is drawn probabilistically from the habitat suitability index
# rather than decided by the suitability value itself.
settlement_stochastic = true
# Coefficients of variation of the three per-larva traits: the developmental
# threshold, the mortality hazard, and the settlement index. Zero would make the
# cohort deterministic.
cv_molt = 0.25
cv_mortality = 0.25
cv_settlement = 0.25

[dvm]
# Diel Vertical Migration: the depth the cohort holds by day and by night, per
# stage, and the swim-speed multipliers that scale the two later stages.
enable_dvm = true
zoea1_day_depth = -50.0       # Zoea I, daytime target depth (m)
zoea1_night_depth = -10.0     # Zoea I, nighttime target depth (m)
zoea2_day_depth = -55.0       # Zoea II, daytime target depth (m)
zoea2_night_depth = -8.0      # Zoea II, nighttime target depth (m)
megalopa_day_depth = -120.0   # Megalopa, daytime target depth (m)
megalopa_night_depth = -60.0  # Megalopa, nighttime target depth (m)
zoea2_depth_factor = 1.2      # Zoea II swim-speed multiplier
megalopa_swim_factor = 1.5    # Megalopa swim-speed multiplier

[molting_and_settlement]
# Phenological development: the degree-day thresholds that move a larva between
# stages, the mortality envelope, and the depths and temperature of the nursery
# habitat it settles on.
#
# The parameter names are the sibling IBM's (GeoIBM's), because the two packages model
# the same animal and a name that means one thing in one and another thing in the other
# is a trap. The stage index is GeoIBM's too: 0 is the egg, 1 zoea I, 2 zoea II,
# 3 the megalopa. The egg is never used here, but it is kept in the vectors so the two
# packages' parameters can be compared entry by entry.
enable_molting = true
temp_base_degreedays = -1.5      # Development base temperature for degree-days (°C)
degree_days_larval = [0.0, 270.0, 270.0, 270.0]
                                # Per-stage degree-day requirement (°C·d), reset at each ecdysis
intermolt_days_larval = [0.0, 36.0, 36.0, 42.0]
                                # Per-stage minimum duration (days): the calendar gate
larval_baseline_hazards = [0.020, 0.020, 0.015]
                                # Baseline daily mortality (day^-1) for zoea I, zoea II, megalopa
larval_temp_opt = 11.0           # The pelagic survival optimum (°C)
larval_temp_sigma = 3.5          # The width of that optimum (°C)
larval_overage_hazard = 0.05     # Daily penalty per 10 days beyond the viable stage duration
larval_max_intermolt_days = 84.0 # The maximum viable duration of a pelagic stage (days)
settlement_min_depth = -250.0 # Deepest edge of the settlement habitat (m)
settlement_max_depth = -50.0  # Shallowest edge of the settlement habitat (m)
settlement_max_temp = 6.0     # Warmest bottom temperature a larva will settle at (°C)

[visualization]
# What the run draws.
interactive_map = true        # The interactive HTML5 Leaflet dashboard
animate_hydro = false         # A hydrodynamic animation (off: it is expensive)
anim_variable = "dashboard"   # Variable to animate: "dashboard", "speed", "temperature", "eta"
anim_fps = 10                 # Animation frame rate
anim_format = "mp4"           # Animation container: "mp4", "gif" or "webm"
anim_depth = -2.5             # Depth slice for the 2-D flow animation (m)
anim_overlay_particles = false # Draw the larvae on top of the flow field
anim_output_path = ""         # Where the animation is written; empty means beside the figures

[runtype]
# What kind of run this is, and what makes it reproducible. The same section the ocean
# half uses, so the two halves of a run describe themselves the same way.
seed = 42                     # Master RNG seed
