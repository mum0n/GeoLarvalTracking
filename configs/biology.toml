# ==============================================================================
#  GeoLarvalTracking — the biology half of a run's configuration
# ==============================================================================
#
#  Split from ParticleTracking.toml during phase 4 of the ParticleTracking split
#  (SPLIT_PLAN.md). The partition itself lives in one place, as the mapping
#  `ParticleTracking.CONFIG_SECTION_DOMAIN`; this file and its sibling are what that
#  mapping produces, regenerated by `scratch/split_config.jl`.
#
#  Sections in this half: biology, dvm, molting_and_settlement, tessellation
#
#  The other half is in ../GeoOceanModel/ParticleTracking.toml.
#
#  A section this half does not own belongs to the other one. Nothing in a half is a
#  second copy of the other: the ocean half declares the domain and the grid the
#  biology half works inside, and after phase 6 the biology half reads the ocean's
#  parameters from the hydrodynamic output file's metadata rather than from any TOML.
# ==============================================================================

[biology]
# Generic pelagic-plankton defaults: no species-specific calibration. Replace the
# biology / dvm / molting_and_settlement values with those of the target organism
# for a real dispersal study.
n_particles = 100
track_duration_days = 10.0
track_dt_seconds = 300.0
min_seabed_depth = 50.0
diffusivity_h = 10.0
diffusivity_v = 1e-4
release_depth_mode = "bottom"
bottom_release_offset = [0.5, 3.0]
enable_initial_ascent = true
ascent_speed = 0.010
ascent_target_depth = -10.0
buffer_km = 50.0

# --- Stochasticity controls -------------------------------------------------
# Coefficients of variation for the three stochastic biology processes. Set any of
# them to 0.0 to get the deterministic mean-field behaviour (particles sharing a
# thermal history molt in lockstep; mortality applied as an expected fraction).
# These are wired to track_larval_cohort by the driver, so changing them changes
# the run and the value is recorded in resolved_config.toml.
#
# 0.25 is a placeholder, not a fitted value: real cohorts show substantial spread in
# developmental rate. Calibrate against field observations before treating any
# result as quantitative.
cv_molt = 0.25                # per-particle degree-day threshold spread
cv_mortality = 0.25           # per-particle mortality-rate spread
cv_settlement = 0.25          # spread on the habitat-suitability index
settlement_stochastic = true  # draw settlement probabilistically rather than on HSI alone


[dvm]
# Stage-dependent diel vertical migration. The stage names are generic; map them
# to real life stages via the config when a species is specified.
enable_dvm = true
zoea1_day_depth = -50.0
zoea1_night_depth = -10.0
zoea2_day_depth = -55.0
zoea2_night_depth = -8.0
megalopa_day_depth = -120.0
megalopa_night_depth = -60.0
zoea2_depth_factor = 1.0
megalopa_swim_factor = 1.0


[molting_and_settlement]
# Generic degree-day phenology. The thresholds below are placeholders that produce
# a complete cohort over the tracking window; they are NOT species measurements.
enable_molting = true
t_base = -1.5
dd_zoea1_to_zoea2 = 65.0
dd_zoea2_to_megalopa = 130.0
dd_megalopa_to_settle = 200.0
settlement_min_depth = -350.0
settlement_max_depth = -50.0
settlement_max_temp = 6.0
mortality_base = 0.01
mortality_thermal_threshold = 15.0
mortality_thermal_sensitivity = 0.02
mortality_cold_threshold = 0.0
mortality_cold_sensitivity = 0.01


[tessellation]
# Voronoi units for connectivity analysis. Small N keeps the baseline quick.
enable_voronoi = true
n_units = 200
core_depth_min = 50.0
core_depth_max = 350.0
prob_core = 0.8
min_res_core_km = 1.5
shallow_depth_min = 0.0
shallow_depth_max = 50.0
prob_shallow = 0.1
min_res_shallow_km = 5.0
deep_depth_min = 350.0
deep_depth_max = 6000.0
prob_deep = 0.1
min_res_deep_km = 10.0
slope_weighting = true
slope_factor = 15.0


